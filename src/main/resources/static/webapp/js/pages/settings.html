<section class="card">
  <h1 class="section-title">Настройки</h1>
  <div class="switch"><span>Отправлять сообщения</span><input id="sendMessages" type="checkbox"/></div>
  <div class="switch"><span>Показывать номер</span><input id="showPhone" type="checkbox"/></div>
  <div><label>Добавить номер</label><input id="phone" placeholder="+7 ..."/></div>
  <div style="margin-top:10px"><label>Страна</label><select id="country"><option>Россия</option><option>Казахстан</option></select></div>
  <div class="row-btns" style="margin-top:12px"><button id="saveSettings" class="btn">Сохранить</button></div>
</section>
