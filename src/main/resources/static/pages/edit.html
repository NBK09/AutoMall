<section class="card"><h2 class="card-title">Редактирование</h2><form id="editForm" class="row-1">
<div class="row"><div><label>Марка</label><input id="eBrand" disabled></div><div><label>Модель</label><input id="eModel" disabled></div></div>
<div class="row"><div><label>Поколение</label><input id="eGeneration" disabled></div><div><label>Двигатель ID</label><input id="eEngine" type="number" required></div></div>
<div class="row"><div><label>Коробка ID</label><input id="eTransmission" type="number" required></div><div><label>Привод ID</label><input id="eDriveType" type="number" required></div></div>
<div class="row"><div><label>Город ID</label><input id="eCity" type="number" required></div><div><label>Год</label><input id="eYear" type="number" required></div></div>
<div class="row"><div><label>Пробег</label><input id="eMileage" type="number" required></div><div><label>Цвет</label><input id="eColor" required></div></div>
<div class="row"><div><label>VIN</label><input id="eVin"></div><div><label>Цена</label><input id="ePrice" type="number" required></div></div>
<div><label>Описание</label><textarea id="eDescription" required></textarea></div>
<div><label>Добавить фото</label><input id="ePhotos" type="file" multiple accept="image/*"></div>
<button class="btn" type="submit">Сохранить</button></form></section>
