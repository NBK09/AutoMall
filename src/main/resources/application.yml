server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auto_mall
    username: postgres
    password: auto123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

management:
  endpoints:
    web:
      exposure:
        include: health

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
s3:
  selectel:
    endpoint: ${SELECTEL_S3_ENDPOINT:https://s3.selcdn.ru}
    region: ${SELECTEL_S3_REGION:ru-1}
    bucket: ${SELECTEL_S3_BUCKET:auto-mall}
    access-key: ${SELECTEL_S3_ACCESS_KEY:}
    secret-key: ${SELECTEL_S3_SECRET_KEY:}
    cdn-base-url: ${SELECTEL_S3_CDN_BASE_URL:https://cdn.example.com}


app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
